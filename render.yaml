# Render.com Blueprint - free forever web service
# Push this repo to GitHub, then in Render: New + > Blueprint > pick the repo.
services:
  - type: web
    name: surestats-bot
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: >-
      streamlit run dashboard/app.py
      --server.port=$PORT
      --server.address=0.0.0.0
      --server.headless=true
      --browser.gatherUsageStats=false
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ODDS_API_KEY
        sync: false
      - key: TENNIS_API_KEY
        sync: false
      - key: BALLDONTLIE_API_KEY
        sync: false
      - key: ODDS_REFRESH_SECONDS
        value: "600"
      - key: LOG_LEVEL
        value: INFO
